# Ollama worker pool for OpenClaw.
# Install on the gateway host: /etc/nginx/conf.d/ollama-pool.conf, then `sudo nginx -t && sudo systemctl reload nginx`.
#
# OpenClaw only moves to the next model on rate limits, auth errors and timeouts, not when a host
# is switched off. This proxy hides dead PCs: it tries the next worker, and uses this host's own
# Ollama (the `backup` line) only when every remote worker is down.

upstream ollama_pool {
    least_conn;  # send each job to the least busy worker

    # One line per remote PC. Use Tailscale IPs (100.x.y.z) or LAN IPs.
    # A worker that fails is skipped for 60s, then tried again.
    server 100.64.0.11:11434 max_fails=1 fail_timeout=60s;
    server 100.64.0.12:11434 max_fails=1 fail_timeout=60s;
    # server 100.64.0.13:11434 max_fails=1 fail_timeout=60s;

    # Last resort: Ollama on this host. Slow, but never runs out.
    server 127.0.0.1:11434 backup;

    keepalive 8;
}

server {
    # Loopback only: OpenClaw on this host is the only client.
    listen 127.0.0.1:11500;

    location / {
        proxy_pass http://ollama_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Ollama streams NDJSON; don't buffer it.
        proxy_buffering off;

        # Fail fast on a dead PC, but let a slow model take its time.
        proxy_connect_timeout 3s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;

        # Try the next worker if one is down, erroring, or doesn't have the model (404).
        # non_idempotent is needed because Ollama requests are POSTs. nginx never retries
        # once it has started sending a reply, so a job is never run twice.
        proxy_next_upstream error timeout http_502 http_503 http_404 non_idempotent;
        proxy_next_upstream_timeout 30s;

        client_max_body_size 50m;
    }
}
